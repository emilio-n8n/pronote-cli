[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pronote-cli"
version = "0.1.0"
description = "Lire ses données Pronote (emploi du temps, devoirs, notes) en ligne de commande"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pronotepy>=2.15.0"]

[project.scripts]
pronote = "pronote_cli.__main__:main"

[tool.setuptools]
packages = ["pronote_cli"]
